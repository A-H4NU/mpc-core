[package]
name = "mpc-core"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/A-H4NU/mpc-core"
description = "A flexible, trait-based core framework and asynchronous execution engine for Multi-Party Computation (MPC) protocols."
license = "MIT OR Apache-2.0"
keywords = ["mpc", "cryptography", "secure-computation", "async"]
categories = ["cryptography", "network-programming", "asynchronous"]

[dependencies]
serde = { version = "1.0.229", features = ["serde_derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
sha3 = "0.12.0"
generic-array = { version = "=0.14.7", features = ["serde"] }
itertools = "0.15.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"], optional = true }
rand = { version = "0.8", optional = true }
base64 = { version = "0.23.1", optional = true }
tokio = { version = "1.43.0", features = [
    "net",
    "io-util",
    "time",
    "macros",
    "rt-multi-thread",
], optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true }
x25519-dalek = { version = "3.0.0", features = [
    "static_secrets",
], optional = true }
anyhow = { version = "1.0.95", optional = true }
futures = { version = "0.3.31", optional = true }

[features]
example-additive = ["dep:rand"]
example-secure-network = [
    "dep:ed25519-dalek",
    "dep:rand",
    "dep:base64",
    "dep:tokio",
    "dep:chacha20poly1305",
    "dep:x25519-dalek",
    "dep:anyhow",
    "dep:futures",
]

[dev-dependencies]
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
